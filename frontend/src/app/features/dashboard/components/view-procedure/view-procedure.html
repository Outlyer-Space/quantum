<div class="dashboard-layout">
    <main class="main-content">
        <div class="preview-container">
            <app-procedure-step-table
                [steps]="flattenedSteps()"
                [readonly]="!isRunningInstance()"
                [inputForm]="inputForm"
                [closedSectionIds]="closedSectionIds()"
                [canEdit]="canEditStep()"
                [pendingUpdates]="pendingUpdatesSignal()"
                (stepToggled)="onStepToggled($event)"
                (inputSet)="onInputSet($event)"
                (inputCleared)="onInputCleared($event)"
                (stepChecked)="onStepChecked($event)"
                (controlFocused)="onControlFocused($event)"
                (controlBlurred)="onControlBlurred()" />
        </div>

        @if (isArchived() && closingComment()) {
        <div class="completion-container archive-comment">
            <h4>Closing Comment</h4>
            <p class="comment-text">{{ closingComment() }}</p>
        </div>
        }

        @if (isRunningInstance() && (allActionableStepsCompleted() || isLeadRole())) {
        <div class="completion-container">
            <div class="closing-comment-input">
                <label for="closingComment">Closing Comment (Optional)</label>
                <textarea #commentBox id="closingComment" (input)="closingComment.set(commentBox.value)" rows="3" placeholder="Enter any final comments or notes before closing..."></textarea>
            </div>
            <button class="btn-complete-modern" (click)="completeProcedure()">
                Close Procedure
            </button>
        </div>
        }
    </main>
</div>
