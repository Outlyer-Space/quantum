<div class="dashboard-layout">
    <main class="main-content">
        @if (isArchived() && archiveSummary()) {
        <div class="archive-header-actions">
            <button class="btn-summary" (click)="openSummary()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                View Summary
            </button>
        </div>
        }
        
        <div class="preview-container">
            <app-procedure-step-table
                [steps]="flattenedSteps()"
                [readonly]="!isRunningInstance()"
                [inputForm]="inputForm"
                [closedSectionIds]="closedSectionIds()"
                [canEdit]="canEditStep()"
                [pendingUpdates]="pendingUpdatesSignal()"
                [remotelyUpdatedSteps]="remotelyUpdatedSteps()"
                [rejectedSteps]="rejectedSteps()"
                (stepToggled)="onStepToggled($event)"
                (inputSet)="onInputSet($event)"
                (inputCleared)="onInputCleared($event)"
                (stepChecked)="onStepChecked($event)"
                (controlFocused)="onControlFocused($event)"
                (controlBlurred)="onControlBlurred()" />
        </div>

        @if (isArchived() && closingComment()) {
        <div class="completion-container archive-comment">
            <h4>Closing Comment</h4>
            <p class="comment-text">{{ closingComment() }}</p>
        </div>
        }

        @if (isRunningInstance() && (allActionableStepsCompleted() || isLeadRole())) {
        <div class="completion-container">
            <div class="closing-comment-input">
                <label for="closingComment">Closing Comment (Optional)</label>
                <textarea #commentBox id="closingComment" (input)="closingComment.set(commentBox.value)" rows="3" placeholder="Enter any final comments or notes before closing..."></textarea>
            </div>
            <button class="btn-complete-modern" (click)="completeProcedure()">
                Close Procedure
            </button>
        </div>
        }
    </main>
    <app-archive-summary-dialog />
    <app-procedure-status-dialog
        [state]="dialogState()"
        (dismiss)="actionError.set(null)"
        (goToArchive)="navigateToArchive()"
        (goToDashboard)="navigateToDashboard()"
    />
</div>
